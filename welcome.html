<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hoshino</title>

    <link rel="icon" href="images/hoshinologotransparent.ico">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            color: #333;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 62px;
            background: #fff;
            border-bottom: 1px solid #d8d8d8;

            display: flex;
            align-items: center;

            padding: 0 28px;

            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }

        .logo-link {
            display: flex;
            align-items: center;

            text-decoration: none;

            cursor: pointer;
        }

        .logo {
            height: 42px;
            width: auto;

            display: block;

            transition: opacity .15s ease,
                        transform .15s ease;
        }

        .logo-link:hover .logo {
            opacity: .85;
            transform: scale(1.03);
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            min-height: calc(100vh - 62px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        .panel {
            width: 410px;
            max-width: 100%;

            background: white;

            border: 1px solid #d5d5d5;
            border-radius: 6px;

            box-shadow: 0 3px 12px rgba(0,0,0,.10);

            overflow: hidden;
        }

        .panel-header {
            padding: 25px 30px;

            background: #fafafa;

            border-bottom: 1px solid #ddd;

            text-align: center;
        }

        .panel-header h1 {
            margin: 0;

            font-size: 26px;
            font-weight: normal;

            color: #444;
        }

        .panel-header p {
            margin: 8px 0 0;

            color: #888;
            font-size: 14px;
        }

        .panel-body {
            padding: 30px;
        }

        /* =========================
           FORM
        ========================= */

        label {
            display: block;

            margin: 0 0 6px;

            font-size: 13px;
            font-weight: bold;

            color: #555;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 17px;

            border: 1px solid #ccc;
            border-radius: 4px;

            background: white;

            font-size: 15px;

            outline: none;

            transition: border-color .15s ease,
                        box-shadow .15s ease;
        }

        input:focus {
            border-color: #ff69b4;

            box-shadow:
                0 0 0 2px rgba(255,105,180,.12);
        }

        .login-button {
            width: 100%;

            padding: 12px;

            border: 0;
            border-radius: 4px;

            background: #ff69b4;

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: background .15s ease;
        }

        .login-button:hover {
            background: #ff4da6;
        }

        .login-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            font-size: 13px;
        }

        .server-status {
            margin-top: 20px;

            text-align: center;

            font-size: 12px;

            color: #999;
        }

        .status-dot {
            display: inline-block;

            width: 8px;
            height: 8px;

            margin-right: 5px;

            border-radius: 50%;

            background: #aaa;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            padding: 15px;

            text-align: center;

            font-size: 12px;

            color: #999;

            border-top: 1px solid #ddd;

            background: #fafafa;
        }

        @media (max-width: 500px) {
            .topbar {
                padding: 0 15px;
            }

            .panel-body {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <!-- CLICKABLE HOSHINO LOGO -->
    <a
        class="logo-link"
        href="welcome.html"
        title="Hoshino Home"
        aria-label="Hoshino Home"
    >
        <img
            class="logo"
            src="images/hoshinofulllogotransparent.ico"
            alt="Hoshino"
        >
    </a>

</header>


<main class="page">

    <section class="panel">

        <div class="panel-header">

            <h1>Welcome to Hoshino</h1>

            <p>
                Sign in to your Hoshino account.
            </p>

        </div>


        <div class="panel-body">

            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    autocomplete="username"
                    placeholder="Enter your username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    id="loginButton"
                    class="login-button"
                    type="submit"
                >
                    Log In
                </button>

            </form>


            <div id="message"></div>


            <div class="server-status">

                <span
                    id="statusDot"
                    class="status-dot"
                ></span>

                <span id="serverStatus">
                    Checking Hoshino server...
                </span>

            </div>

        </div>


        <div class="footer">
            Hoshino • 2016 Revival Project
        </div>

    </section>

</main>


<script>

const API = "http://localhost:3000";

const form =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const serverStatus =
    document.getElementById("serverStatus");

const statusDot =
    document.getElementById("statusDot");


// =========================
// CHECK SERVER
// =========================

async function checkServer() {

    try {

        const response =
            await fetch(API + "/", {
                method: "GET",
                credentials: "include"
            });

        if (!response.ok) {
            throw new Error();
        }

        serverStatus.textContent =
            "Hoshino server online";

        statusDot.style.background =
            "#48a868";

    } catch {

        serverStatus.textContent =
            "Unable to connect to Hoshino server";

        statusDot.style.background =
            "#d9534f";
    }
}


// =========================
// CHECK EXISTING SESSION
// =========================

async function checkSession() {

    try {

        const response =
            await fetch(API + "/api/me", {
                credentials: "include"
            });

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        if (data.loggedIn === true) {

            window.location.replace(
                "homepage.html"
            );
        }

    } catch {

        // Server check handles connection message.
    }
}


// =========================
// LOGIN
// =========================

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        message.textContent =
            "Logging in...";

        message.style.color =
            "#777";

        loginButton.disabled = true;


        try {

            const response =
                await fetch(
                    API + "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.error ||
                    "Login failed.";

                message.style.color =
                    "#d9534f";

                loginButton.disabled =
                    false;

                return;
            }


            message.textContent =
                "Login successful!";

            message.style.color =
                "#48a868";


            window.location.replace(
                "homepage.html"
            );

        } catch {

            message.textContent =
                "Unable to connect to the Hoshino server.";

            message.style.color =
                "#d9534f";

            loginButton.disabled =
                false;
        }

    }
);


// Start
checkServer();
checkSession();

</script>

</body>
</html>
