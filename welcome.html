<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Hoshino</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 380px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            margin: 5px 0;
            font-size: 32px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: 0;
            border-radius: 9px;
            background: #ff69b4;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff4da6;
        }

        #message {
            margin-top: 15px;
            min-height: 20px;
            color: #d33;
        }

        .status {
            font-size: 13px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="images/hoshinofulllogotransparent.ico"
        class="logo"
        alt="Hoshino"
    >

    <h1>Welcome to Hoshino</h1>

    <div class="subtitle">
        Your Hoshino account
    </div>

    <form id="loginForm">

        <input
            id="username"
            type="text"
            placeholder="Username"
            required
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            required
            autocomplete="current-password"
        >

        <button type="submit">
            Log In
        </button>

    </form>

    <div id="message"></div>

    <div class="status">
        Hoshino API connection required
    </div>

</div>

<script>
const API = "http://localhost:3000";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

// Check whether we're already logged in
async function checkSession() {
    try {
        const response = await fetch(API + "/api/me", {
            method: "GET",
            credentials: "include"
        });

        if (!response.ok) {
            return;
        }

        const data = await response.json();

        if (data.loggedIn === true) {
            window.location.replace("homepage.html");
        }

    } catch (error) {
        message.textContent =
            "Unable to connect to the Hoshino server.";
    }
}

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    message.textContent = "Logging in...";
    message.style.color = "#777";

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    try {

        const response = await fetch(API + "/api/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if (!response.ok) {

            message.style.color = "#d33";

            message.textContent =
                data.error || "Login failed.";

            return;
        }

        message.style.color = "#2a9d5b";
        message.textContent = "Login successful!";

        window.location.replace("homepage.html");

    } catch (error) {

        message.style.color = "#d33";

        message.textContent =
            "Unable to connect to the Hoshino server.";
    }
});

checkSession();
</script>

</body>
</html>
