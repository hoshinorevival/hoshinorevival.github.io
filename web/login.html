<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hoshino - Login</title>

    <link rel="icon" href="../images/hoshinologotransparent.ico">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        .box {
            width: min(90%, 420px);
            background: white;
            border: 2px solid #222;
            padding: 35px;
            box-shadow: 8px 8px 0 #222;
        }

        .logo {
            display: block;
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin: 0 auto 20px;
        }

        h1 {
            text-align: center;
            margin: 0 0 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #222;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 2px solid #222;
            background: #222;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: white;
            color: #222;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .signup {
            margin-top: 20px;
            text-align: center;
        }

        .signup a {
            color: #222;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <img
        src="../images/hoshinofulllogotransparent.ico"
        class="logo"
        alt="Hoshino"
    >

    <h1>Sign In</h1>

    <form id="loginForm">

        <label for="username">
            Username
        </label>

        <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button
            id="loginButton"
            type="submit"
        >
            Sign In
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

    <div class="signup">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </div>

</div>

<script>

const API = "http://localhost:3000";

const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    button.disabled = true;
    button.textContent = "Signing in...";
    message.textContent = "";

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    try {

        const response = await fetch(
            API + "/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const data = await response.json();

        console.log("Login response:", data);

        if (!response.ok) {

            message.textContent =
                data.message ||
                data.error ||
                "Invalid username or password.";

            button.disabled = false;
            button.textContent = "Sign In";

            return;
        }

        /*
         * Get the username returned by the server.
         * Supports several common response formats.
         */

        const loggedInUsername =
            data.user?.username ||
            data.username ||
            username;

        /*
         * Save the username locally so the homepage
         * can display it immediately.
         */

        localStorage.setItem(
            "hoshino_username",
            loggedInUsername
        );

        /*
         * Also save the returned account ID if available.
         */

        if (data.user?.id !== undefined) {

            localStorage.setItem(
                "hoshino_user_id",
                data.user.id
            );

        } else if (data.id !== undefined) {

            localStorage.setItem(
                "hoshino_user_id",
                data.id
            );

        }

        /*
         * Save the role if the server returned one.
         */

        if (data.user?.role) {

            localStorage.setItem(
                "hoshino_user_role",
                data.user.role
            );

        } else if (data.role) {

            localStorage.setItem(
                "hoshino_user_role",
                data.role
            );

        }

        window.location.replace(
            "homepage.html"
        );

    } catch (error) {

        console.error(
            "Login error:",
            error
        );

        message.textContent =
            "Could not connect to Hoshino.";

        button.disabled = false;
        button.textContent = "Sign In";
    }

});

</script>

</body>
</html>
